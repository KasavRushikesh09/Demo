<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - IT Companies Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #06b6d4;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-color: #1e293b;
            --light-color: #f8fafc;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hero-section {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(5, 150, 105, 0.9));
            color: white;
            padding: 4rem 0;
            text-align: center;
        }

        .career-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            overflow: hidden;
            border: none;
            backdrop-filter: blur(10px);
            height: 100%;
        }

        .career-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        }

        .job-type-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .job-type-fulltime {
            background: linear-gradient(135deg, var(--success-color), #059669);
            color: white;
        }

        .job-type-parttime {
            background: linear-gradient(135deg, var(--warning-color), #d97706);
            color: white;
        }

        .job-type-contract {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .job-type-internship {
            background: linear-gradient(135deg, var(--accent-color), #0891b2);
            color: white;
        }

        .experience-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .experience-entry {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .experience-mid {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .experience-senior {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .experience-executive {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color), #059669);
            border: none;
            border-radius: 25px;
            padding: 8px 20px;
            font-weight: 600;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger-color), #dc2626);
            border: none;
            border-radius: 25px;
            padding: 8px 20px;
            font-weight: 600;
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning-color), #d97706);
            border: none;
            border-radius: 25px;
            padding: 8px 20px;
            font-weight: 600;
        }

        .search-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
        }

        .form-control {
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25);
        }

        .modal-content {
            border-radius: 20px;
            border: none;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            background: linear-gradient(135deg, var(--success-color), #059669);
            color: white;
            border-radius: 20px 20px 0 0;
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stats-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--success-color);
        }

        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--success-color), #059669);
            color: white;
            border: none;
            font-size: 24px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .floating-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(16, 185, 129, 0.4);
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .career-info {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .career-info i {
            color: var(--success-color);
            margin-right: 5px;
        }

        .salary-highlight {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            padding: 0.5rem 1rem;
            border-radius: 15px;
            font-weight: 600;
            display: inline-block;
        }

        .company-logo-small {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 8px;
            background: white;
            padding: 5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-building me-2"></i>IT Companies Portal
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">
                    <i class="fas fa-building me-1"></i>Companies
                </a>
                <a class="nav-link active" href="careers.html">
                    <i class="fas fa-briefcase me-1"></i>Careers
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3">Find Your Dream Job</h1>
            <p class="lead mb-4">Discover exciting career opportunities at top IT companies</p>
            <button class="btn btn-light btn-lg me-3" onclick="showCareers()">
                <i class="fas fa-search me-2"></i>Browse Jobs
            </button>
            <a href="index.html" class="btn btn-outline-light btn-lg">
                <i class="fas fa-building me-2"></i>View Companies
            </a>
        </div>
    </section>

    <!-- Search Section -->
    <div class="container">
        <div class="search-section">
            <div class="row">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search jobs...">
                </div>
                <div class="col-md-2">
                    <select class="form-control" id="jobTypeFilter">
                        <option value="">All Job Types</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-control" id="experienceFilter">
                        <option value="">All Levels</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-control" id="locationFilter">
                        <option value="">All Locations</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-control" id="companyFilter">
                        <option value="">All Companies</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-primary w-100" onclick="filterCareers()">
                        <i class="fas fa-filter"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Section -->
    <div class="container mb-4">
        <div class="row">
            <div class="col-md-3">
                <div class="stats-card">
                    <i class="fas fa-briefcase fa-2x text-success mb-2"></i>
                    <div class="stats-number" id="totalJobs">0</div>
                    <p class="mb-0">Total Jobs</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <i class="fas fa-building fa-2x text-primary mb-2"></i>
                    <div class="stats-number" id="totalCompanies">0</div>
                    <p class="mb-0">Companies</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <i class="fas fa-map-marker-alt fa-2x text-info mb-2"></i>
                    <div class="stats-number" id="totalLocations">0</div>
                    <p class="mb-0">Locations</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <i class="fas fa-dollar-sign fa-2x text-warning mb-2"></i>
                    <div class="stats-number" id="avgSalary">$0</div>
                    <p class="mb-0">Avg Salary</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Careers Section -->
    <div class="container">
        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        
        <div class="row" id="careersContainer">
            <!-- Careers will be loaded here -->
        </div>
    </div>

    <!-- Floating Add Button -->
    <button class="floating-btn" onclick="showAddCareerModal()">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Add/Edit Career Modal -->
    <div class="modal fade" id="careerModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add New Job</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="careerForm">
                        <input type="hidden" id="careerId">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Job Title *</label>
                                    <input type="text" class="form-control" id="jobTitle" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Company Name *</label>
                                    <input type="text" class="form-control" id="companyName" required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Location *</label>
                                    <input type="text" class="form-control" id="location" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Job Type *</label>
                                    <select class="form-control" id="jobType" required>
                                        <option value="">Select Job Type</option>
                                        <option value="Full-time">Full-time</option>
                                        <option value="Part-time">Part-time</option>
                                        <option value="Contract">Contract</option>
                                        <option value="Internship">Internship</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Experience Level *</label>
                                    <select class="form-control" id="experienceLevel" required>
                                        <option value="">Select Experience Level</option>
                                        <option value="Entry">Entry</option>
                                        <option value="Mid">Mid</option>
                                        <option value="Senior">Senior</option>
                                        <option value="Executive">Executive</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Salary Range</label>
                                    <input type="text" class="form-control" id="salaryRange" placeholder="e.g., $80,000 - $120,000">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Job Description *</label>
                            <textarea class="form-control" id="description" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Requirements</label>
                            <textarea class="form-control" id="requirements" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Benefits</label>
                            <textarea class="form-control" id="benefits" rows="2"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Application Deadline</label>
                                    <input type="date" class="form-control" id="applicationDeadline">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Contact Email</label>
                                    <input type="email" class="form-control" id="contactEmail">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Application URL</label>
                            <input type="url" class="form-control" id="applicationUrl">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="saveCareer()">Save Job</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/careers.js"></script>
</body>
</html>
